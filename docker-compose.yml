services:
  db:
    image: postgres:16-alpine
    container_name: alecrim_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alecrim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-alecrim}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alecrim} -d ${POSTGRES_DB:-alecrim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: alecrim_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alecrim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alecrim}
      # Ativa o hard-fail de SECRET_KEY inseguro em app/__init__.py - só
      # nesse deploy via compose (dev local com `python wsgi.py`/pytest
      # continua só com warning). Se subir sem SECRET_KEY real em
      # backend/.env, o container falha ao iniciar em vez de rodar com
      # autenticação admin forjável.
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8002}:8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
    container_name: alecrim_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3002}:3000"
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge