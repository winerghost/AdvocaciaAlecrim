# OPCIONAL - só instale se o domínio passar pelo proxy da Cloudflare (registro
# DNS com a nuvem laranja). Vai em /etc/nginx/conf.d/ (contexto `http`), não
# dentro do `server` de alecrim.conf.
#
# Com a Cloudflare na frente, toda conexão chega ao Nginx vinda de um IP da
# própria Cloudflare. Sem este arquivo, `$remote_addr` é o IP do ponto de
# presença dela e é isso que o Flask recebe como "IP do cliente": o rate
# limit de login passa a contar visitantes diferentes como um só, e o `ip=`
# das linhas AUDIT não identifica ninguém. Com ele, o Nginx troca
# `$remote_addr` pelo valor de CF-Connecting-IP - mas SÓ quando a conexão
# vem de uma das faixas abaixo; de qualquer outra origem o header é
# ignorado, então não dá para forjar o IP batendo direto na VPS.
#
# Sem Cloudflare na frente, NÃO instale: não há ganho, e as faixas ficariam
# confiáveis à toa.
#
# CONFIRA AS FAIXAS antes de usar e de tempos em tempos. A lista abaixo foi
# escrita de memória, não baixada da fonte - a oficial é:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
# Faixa faltando = visitantes daquele trecho voltam a aparecer com IP da
# Cloudflare. Faixa sobrando (que não é mais dela) = quem controlar aquele
# endereço pode forjar o IP de origem.
#
# Recomendado junto: liberar as portas 80/443 da VPS no firewall só para
# essas mesmas faixas, para ninguém contornar a Cloudflare indo direto ao IP
# do servidor. E usar o modo SSL "Full (strict)" na Cloudflare, senão o
# trecho Cloudflare -> VPS trafega sem validação de certificado.
#
# Requer o módulo ngx_http_realip_module (já vem nos pacotes nginx do
# Debian/Ubuntu; confira com `nginx -V 2>&1 | grep -o http_realip`).

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
