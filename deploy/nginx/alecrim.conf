# Nginx do host (VPS) na frente do docker-compose deste projeto.
#
# REFERÊNCIA versionada - não é aplicada sozinha. O que roda de verdade é o
# arquivo em /etc/nginx/ da VPS; mantenha os dois iguais (mudou lá, traga a
# mudança pra cá no mesmo commit). Este arquivo nunca foi testado contra a
# VPS real: confira com `nginx -t` antes de recarregar.
#
# Instalação (Debian/Ubuntu):
#   1. Troque TODAS as ocorrências de `exemplo.com.br` pelo domínio real
#      (o resto do repo usa a forma com `www.` como canônica: CORS_ORIGINS
#      em backend/.env.example e SITE_URL em frontend/components/blog/utils.ts).
#   2. Confira a porta do upstream abaixo com FRONTEND_PORT do .env da raiz.
#   3. sudo cp deploy/nginx/alecrim.conf /etc/nginx/sites-available/alecrim.conf
#      sudo ln -s /etc/nginx/sites-available/alecrim.conf /etc/nginx/sites-enabled/
#   4. Só se o domínio passar pela Cloudflare (nuvem laranja):
#      sudo cp deploy/nginx/cloudflare-real-ip.conf /etc/nginx/conf.d/
#      (leia o cabeçalho daquele arquivo antes).
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Por que isto é item de segurança e não só de infraestrutura
# -----------------------------------------------------------
# O navegador só fala com o Next. As rotas /api/** do Next repassam o
# header X-Forwarded-For como chegou para o Flask, e o Flask confia no
# ÚLTIMO endereço da lista (`ProxyFix(x_for=1)` em backend/app/__init__.py).
# Esse endereço vira `request.remote_addr`, que é a chave do rate limit de
# /api/admin/login e /api/leads e o `ip=` das linhas "AUDIT ..." do log.
#
# Quem garante que o último endereço da lista é o do cliente de verdade é
# ESTE arquivo: `$proxy_add_x_forwarded_for` acrescenta `$remote_addr` (o
# IP que o Nginx viu na conexão) ao final do que o cliente mandou. Um
# X-Forwarded-For forjado pelo cliente fica antes e é ignorado pelo Flask.
# Consequências:
#   - sem a linha `proxy_set_header X-Forwarded-For`, o Flask enxerga o IP
#     do container do Next para todo mundo e o limite de tentativas de login
#     vira um contador global (qualquer um tranca o painel para todos);
#   - não coloque outro proxy entre este Nginx e o Next, nem mude o
#     `x_for=1` do Flask, sem rever as duas pontas juntas.
#
# O que NÃO fica aqui, de propósito
# ---------------------------------
#   - Content-Security-Policy: o app já emite uma CSP com nonce por resposta
#     em frontend/proxy.ts. Uma segunda CSP no Nginx (ainda mais com
#     'unsafe-inline') se soma à primeira e quebra a página ou afrouxa a
#     política. Não adicione.
#   - X-Content-Type-Options, X-Frame-Options, Referrer-Policy e
#     Permissions-Policy: já vêm do Next (frontend/next.config.js).
#   - O Flask (127.0.0.1:BACKEND_PORT): não tem `location` nem upstream
#     aqui e não deve ter. Ele só é alcançado pelo Next, pela rede interna
#     do compose. A porta em 127.0.0.1 existe só para diagnóstico na VPS.

# Next.js (serviço `frontend` do docker-compose.yml). A porta é a
# FRONTEND_PORT do .env da raiz: 3000 no .env.example, mas o default do
# compose quando a variável não existe é 3002.
upstream alecrim_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---- HTTP: só redireciona para HTTPS ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name exemplo.com.br www.exemplo.com.br;

    # Desafio HTTP-01 do Let's Encrypt (certbot --webroot -w /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.exemplo.com.br$request_uri;
    }
}

# ---- HTTPS: domínio sem www -> www ------------------------------------------
server {
    # `listen ... http2` funciona em qualquer versão; do nginx 1.25.1 em
    # diante gera só um aviso de depreciação (o novo é a diretiva `http2 on;`).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.exemplo.com.br$request_uri;
}

# ---- HTTPS: site -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.exemplo.com.br;

    # Mesmo certificado, emitido para os dois nomes
    # (certbot ... -d exemplo.com.br -d www.exemplo.com.br).
    ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:alecrim_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # HSTS: um ano, com subdomínios. Só mantenha `includeSubDomains` se TODO
    # subdomínio do domínio atender em HTTPS (o navegador passa a recusar
    # HTTP em todos eles por um ano). Sem `preload` de propósito: entrar na
    # lista de preload é difícil de desfazer e é decisão do dono do domínio.
    # `always` faz o header sair também nas respostas de erro.
    # Atenção: `add_header` dentro de um `location` substitui os do `server`
    # em vez de somar - por isso o location de upload abaixo repete este.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Teto do corpo da requisição. O maior payload fora do upload é o JSON
    # de um artigo: ARTICLE_MAX_CONTENT_LENGTH = 2 MB (backend/app/config.py).
    # Fica um pouco acima para quem responde ao estouro ser o app, com a
    # mensagem dele, e não um 413 cru do Nginx.
    client_max_body_size 3m;

    # Headers repassados ao Next. Ficam no nível do `server` e valem para
    # todos os `location` abaixo PORQUE nenhum deles declara
    # `proxy_set_header`: se um location declarar um, ele perde todos estes.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # frontend/proxy.ts usa este para saber que a requisição original era HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Upload de imagem do painel: UPLOAD_MAX_BYTES = 5 MB, e o próprio Flask
    # aceita 5 MB + 64 KB de envelope multipart (backend/app/utils/
    # request_limits.py). 6m cobre isso com folga; se UPLOAD_MAX_BYTES
    # mudar, mude aqui junto.
    location = /api/admin/uploads {
        client_max_body_size 6m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://alecrim_frontend;
    }

    location / {
        proxy_pass http://alecrim_frontend;
    }
}
